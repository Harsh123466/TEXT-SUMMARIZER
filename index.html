<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Summarizer</title>
    <style>
        :root {
            --bg: #0b1120;
            --surface: rgba(12, 23, 48, 0.92);
            --surface-strong: rgba(16, 34, 72, 0.95);
            --text: #f8fafc;
            --muted: #cbd5e1;
            --accent: #7c3aed;
            --accent-2: #38bdf8;
            --border: rgba(148, 163, 184, 0.16);
            --shadow: 0 30px 80px rgba(0, 0, 0, 0.22);
            --radius: 28px;
        }

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: var(--text);
            background: radial-gradient(circle at top left, rgba(59, 130, 246, 0.18), transparent 22%),
                        radial-gradient(circle at bottom right, rgba(56, 189, 248, 0.14), transparent 24%),
                        linear-gradient(180deg, #06101f 0%, #0b1526 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at 28% 18%, rgba(124, 58, 237, 0.18), transparent 18%),
                        radial-gradient(circle at 72% 78%, rgba(56, 189, 248, 0.14), transparent 20%);
            pointer-events: none;
        }

        .container {
            position: relative;
            width: min(100%, 820px);
            background: linear-gradient(180deg, rgba(10, 18, 36, 0.96), rgba(8, 14, 28, 0.98));
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            backdrop-filter: blur(18px);
            padding: 42px;
            overflow: hidden;
        }

        .container::after {
            content: '';
            position: absolute;
            inset: -60px -120px auto auto;
            width: 260px;
            height: 260px;
            background: rgba(124, 58, 237, 0.18);
            border-radius: 50%;
            filter: blur(40px);
            z-index: 0;
        }

        .content {
            position: relative;
            z-index: 1;
        }

        h1 {
            margin: 0;
            font-size: clamp(2.4rem, 3vw, 3.6rem);
            letter-spacing: -0.06em;
            line-height: 1.02;
        }

        h3 {
            margin: 16px 0 28px;
            font-weight: 500;
            color: var(--muted);
        }

        p {
            margin: 0 0 22px;
            line-height: 1.8;
            color: var(--muted);
        }

        form {
            display: grid;
            gap: 18px;
        }

        textarea {
            width: 100%;
            min-height: 220px;
            resize: vertical;
            border: 1px solid rgba(148, 163, 184, 0.16);
            border-radius: 22px;
            padding: 22px;
            font-size: 1rem;
            line-height: 1.8;
            color: var(--text);
            background: rgba(255, 255, 255, 0.05);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06);
            transition: border-color 0.2s ease, transform 0.2s ease, background 0.2s ease;
        }

        textarea::placeholder {
            color: rgba(203, 213, 225, 0.7);
        }

        textarea:focus {
            outline: none;
            border-color: rgba(56, 189, 248, 0.4);
            background: rgba(255, 255, 255, 0.08);
            transform: translateY(-1px);
        }

        .button-row {
            display: flex;
            justify-content: flex-start;
        }

        button {
            padding: 16px 24px;
            border: none;
            border-radius: 18px;
            background: linear-gradient(135deg, #7c3aed, #22d3ee);
            color: #ffffff;
            font-weight: 600;
            font-size: 1rem;
            letter-spacing: 0.01em;
            cursor: pointer;
            box-shadow: 0 18px 50px rgba(124, 58, 237, 0.18);
            transition: transform 0.2s ease, box-shadow 0.2s ease, opacity 0.2s ease;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 24px 62px rgba(124, 58, 237, 0.24);
        }

        .summary-output {
            margin-top: 32px;
            padding: 28px;
            border-radius: 22px;
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.02);
        }

        #summary-heading {
            margin: 0 0 14px;
            font-size: 1.15rem;
        }

        #summary-text {
            margin: 0;
            min-height: 120px;
            line-height: 1.9;
            color: #e2e8f0;
            white-space: pre-wrap;
        }

        .note {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            padding: 12px 16px;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.04);
            color: #94a3b8;
            font-size: 0.95rem;
        }

        .note::before {
            content: '✨';
        }

        @media (max-width: 720px) {
            body {
                padding: 20px;
            }

            .container {
                padding: 28px;
            }

            h1 {
                font-size: 2.4rem;
            }

            textarea {
                min-height: 180px;
            }

            .button-row {
                justify-content: stretch;
            }

            button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Text Summarizer</h1>
        <h3>using huggingface transformers</h3>
        <p>Write your content here for summarization:</p>
        <div class="note">Paste your text and click summarize for a crisp result.</div>

        <form id="summarization-form">
            <textarea id="content-input" placeholder="Enter your content here..." required></textarea>
            <div class="button-row">
                <button type="submit">Summarize</button>
            </div>
        </form>

        <div class="summary-output">
            <h3 id="summary-heading">Content Summary</h3>
            <p id="summary-text"></p>
        </div>
    </div>

    <script>
        const form = document.getElementById('summarization-form');
        const contentInput = document.getElementById('content-input');
        const summaryText = document.getElementById('summary-text');
        const submitButton = document.querySelector('button');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const content = contentInput.value.trim();
            if (!content) return;

            summaryText.textContent = 'Summarizing...';
            submitButton.disabled = true;

            try {
                const response = await fetch("http://127.0.0.1:8000/summarize", {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ dialogue: content })
                });

                if (!response.ok) {
                    throw new Error(`Error: ${response.statusText}`);
                }

                const data = await response.json();
                summaryText.textContent = data.summary || 'No summary available.';
            } catch (error) {
                summaryText.textContent = `Failed to summarize: ${error.message}`;
            } finally {
                submitButton.disabled = false;
            }
        });
    </script>
    
</body>
</html>
